server.port=28090
spring.thymeleaf.cache=false
spring.datasource.name=newbee-mall-datasource
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3307/newbee_mall_pro?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
# 凭据走环境变量，冒号后为本地开发默认值；生产环境必须通过环境变量注入，禁止明文入库
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:newbee123}
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.pool-name=hikariCP
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
# mybatis config
mybatis.mapper-locations=classpath:mapper/*Mapper.xml
# Enable only after applying and reviewing the admin RBAC migration.
newbee.mall.rbac.enabled=false